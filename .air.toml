root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./tmp/main"
# TODO: freeze v1 and exclude templ from build
cmd = "templ generate && cd sqlc && sqlc generate && cd ../v2 && /bin/sh ./update-protos.sh && cd ./svelte && npm run build && cd ../.. && go build -o ./tmp/main ."
delay = 1000
exclude_dir = [
    "tmp",
    "vendor",
    "e2e-test",
    "sqlc/db_entities",
    "v2/svelte/dist",
    "v2/svelte/node_modules",
    "v2/svelte/proto-ts",
    "v2/proto-go",
]
exclude_file = []
exclude_regex = ["_test.go", "_templ.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = [
    "go",
    "templ",
    "html",
    "sql",
    "svelte",
    "js",
    "ts",
    "css",
    "json",
]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = ["mkdir -p db"]
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
